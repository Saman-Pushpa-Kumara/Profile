<style type="text/css">
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Devanagari:wght@300&display=swap'); 
*{
padding:0;
margin:0;
outline:0;
}
body{
background:black;
}
.mid{
height:300px;
width:100%;
position:absolute;
top:200px;
left:0;
text-align:center;
}
.mid img{
position:relative;
max-height:150px;
max-width:150px;
display:block;
margin:auto;
filter:grayscale(.2);
border-radius:50%;  
}
.mid:after{
content:'';
height:140px;
width:140px;
display:block;
position:absolute;
top:5px;
left:calc(50% - 70px);
box-shadow:0 0 10px rgb(0,0,0) ,0 0 15px rgb(0,0,0),0 0 25px rgb(00,0,0) ,0 0 30px rgb(0,0,0)  ;
border-radius:500px;
}
.mid:before{
content:'';
height:160px;
width:160px;
display:block;
border-radius:50%;
position:absolute;
top:-5px;
left:calc(50% - 80px);
background:linear-gradient(120deg , #0f8, #0dd);
filter:blur(20px);
animation:ani 3s linear infinite;
}
@keyframes ani{
0%{
filter:blur( 20px) hue-rotate(0deg);
}
50%{
filter:blur( 40px) hue-rotate(90deg);
}
100%{
filter:blur( 20px) hue-rotate(0deg);
}
}
.nam{
font-family: 'IBM Plex Sans Devanagari', sans-serif;
position:absolute;
top:400px;
left:0;
width:100%;
height:50px;
text-align:center;
line-height:50px;
font-size:35px;
color:transparent;
background:linear-gradient(90deg ,#e0286c,#5328e0);
background-clip:text;
-webkit-background-clip:text;
animation:an 3s linear infinite;
}
@keyframes an{
0%{
filter:hue-rotate(0deg);
}
50%{
filter:hue-rotate(90deg);
}
100%{
filter:hue-rotate(0deg);
}
}
.fbox{
position:absolute;
top:500px;
left:0;
width:100%;
height:50px;
text-align:center;
line-height:50px;
font-size:35px;
color:white;
}
.fbox i{
margin-left:20px;
}
a{
color:white;
text-decoration:none;
}
</style>

<div class="mid" >
