<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-CORE // Realtime Secure Chat</title>
    
    <!-- iOS Meta Tags -->
    <meta name="theme-color" content="#060913">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3256/3256783.png">

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060913;
            --bg-card: rgba(13, 20, 36, 0.75);
            --cyan-glow: #00f2fe;
            --blue-glow: #4facfe;
            --neon-green: #00ffa3;
            --neon-red: #ff3366;
            --border-glow: rgba(0, 242, 254, 0.25);
            --text-main: #f0f4fc;
            --text-dim: #798ba7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background: radial-gradient(circle at 50% 50%, #0e172a 0%, #04070d 100%);
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
            margin: 0;
        }

        /* Ambient Glow Background */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .chat-container { 
            width: 100%; 
            max-width: 460px; 
            height: 94vh;
            background: var(--bg-card); 
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(16px);
            border-radius: 20px; 
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15), inset 0 0 15px rgba(0, 242, 254, 0.05); 
            display: flex; 
            flex-direction: column; 
            position: relative;
            overflow: hidden;
        }

        /* Top Header */
        .chat-header { 
            padding: 16px 20px; 
            background: rgba(10, 16, 30, 0.85);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .app-brand { display: flex; align-items: center; gap: 10px; }
        .pulse-indicator {
            width: 10px; height: 10px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }
        .app-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 1.5px; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glow); color: var(--cyan-glow); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; }
        .icon-btn:hover { background: rgba(0, 242, 254, 0.2); box-shadow: 0 0 10px var(--cyan-glow); }

        /* Tech Menu Dropdown */
        .tech-menu { position: absolute; top: 65px; right: 20px; background: #0d1527; border: 1px solid var(--cyan-glow); border-radius: 12px; width: 180px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 99; }
        .tech-menu.show { display: flex; }
        .tech-menu-item { padding: 12px 16px; font-size: 13px; color: var(--text-main); background: none; border: none; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; font-family: 'JetBrains Mono', monospace; }
        .tech-menu-item:hover { background: rgba(0, 242, 254, 0.15); color: var(--cyan-glow); }

        /* Chat Message List */
        .chat-messages { flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 4px; }
        .message-row { display: flex; flex-direction: column; max-width: 82%; position: relative; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message-row.sent { align-self: flex-end; align-items: flex-end; }
        .message-row.received { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 10px 14px; border-radius: 12px; word-break: break-word; font-size: 13.5px; line-height: 1.45; }
        .message-row.sent .bubble { background: linear-gradient(135deg, rgba(0, 150, 255, 0.25) 0%, rgba(0, 242, 254, 0.15) 100%); border: 1px solid rgba(0, 242, 254, 0.4); border-bottom-right-radius: 2px; color: #ffffff; box-shadow: 0 0 12px rgba(0, 242, 254, 0.1); }
        .message-row.received .bubble { background: rgba(18, 27, 47, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); border-bottom-left-radius: 2px; color: #d1d9e6; }
        .msg-meta { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--text-dim); margin-top: 4px; }
        .msg-sender { font-weight: 600; color: var(--cyan-glow); font-size: 11px; margin-bottom: 3px; }
        .delete-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 2px 4px; font-size: 11px; opacity: 0.5; transition: 0.2s; }
        .delete-btn:hover { color: var(--neon-red); opacity: 1; }

        /* Quick Emojis */
        .emoji-bar { display: flex; gap: 6px; padding: 6px 16px; background: rgba(8, 14, 25, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.05); overflow-x: auto; }
        .emoji-btn { background: none; border: none; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: 0.2s; }
        .emoji-btn:hover { background: rgba(0, 242, 254, 0.15); transform: scale(1.2); }

        /* Input Controls */
        .chat-input-area { padding: 12px 16px; background: rgba(8, 13, 24, 0.95); border-top: 1px solid var(--border-glow); display: flex; align-items: center; gap: 10px; }
        .message-input { flex: 1; background: rgba(19, 29, 52, 0.7); border: 1px solid rgba(0, 242, 254, 0.2); padding: 12px 16px; color: var(--text-main); border-radius: 25px; font-size: 14px; outline: none; font-family: inherit; transition: border 0.3s ease; }
        .message-input:focus { border-color: var(--cyan-glow); box-shadow: 0 0 10px rgba(0, 242, 254, 0.25); }
        .send-btn { background: linear-gradient(135deg, var(--cyan-glow), var(--blue-glow)); border: none; border-radius: 50%; width: 44px; height: 44px; color: #040914; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); transition: transform 0.2s, box-shadow 0.2s; }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 0 20px var(--cyan-glow); }

        /* Security Lock Overlay */
        .security-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(6, 10, 19, 0.96); backdrop-filter: blur(20px); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; }
        .lock-icon-box { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--cyan-glow); box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--cyan-glow); }
        .sec-input { width: 100%; padding: 12px 15px; margin-bottom: 12px; background: rgba(16, 26, 46, 0.8); border: 1px solid var(--border-glow); border-radius: 10px; color: #fff; outline: none; font-family: inherit; text-align: center; font-size: 15px; }
        .sec-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #00f2fe, #4facfe); border: none; border-radius: 10px; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 16px; color: #040914; letter-spacing: 1px; cursor: pointer; margin-top: 6px; }
        .sec-btn:hover { box-shadow: 0 0 15px var(--cyan-glow); }

        /* === PWA INSTALL NOTIFICATION BANNER === */
        .pwa-notification {
            position: fixed; bottom: -120px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 16, 30, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--cyan-glow); border-radius: 16px;
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 15px;
            z-index: 3000; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.2);
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 90%; max-width: 440px;
        }
        .pwa-notification.show { bottom: 20px; }
        .pwa-text { display: flex; flex-direction: column; }
        .pwa-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.2rem; color: #fff; letter-spacing: 1px; }
        .pwa-desc { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dim); }
        .pwa-actions { display: flex; align-items: center; gap: 8px; }
        .pwa-install-btn {
            background: linear-gradient(90deg, var(--cyan-glow), var(--blue-glow));
            color: #040914; border: none; padding: 8px 16px; border-radius: 8px;
            font-size: 0.85rem; font-weight: 700; font-family: 'Rajdhani', sans-serif;
            cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px;
        }
        .pwa-install-btn:hover { box-shadow: 0 0 15px var(--cyan-glow); transform: translateY(-2px); }
        .pwa-close-btn { background: transparent; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; transition: color 0.3s ease; padding: 0 5px; }
        .pwa-close-btn:hover { color: var(--neon-red); }
    </style>
</head>
<body>

<div class="chat-container">
    
    <!-- Security Lock Overlay -->
    <div class="security-screen" id="security-screen">
        <div class="lock-icon-box">
            <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <h2 id="sec-title" style="font-family: 'Rajdhani'; margin-bottom: 6px; color: #fff;">SECURITY AUTH</h2>
        <p id="sec-desc" style="font-size: 12px; color: var(--text-dim); margin-bottom: 20px;">Enter credentials to decrypt channel</p>
        
        <input type="text" id="sec-username" class="sec-input" placeholder="Display Name (නම)" />
        <input type="password" id="sec-password" class="sec-input" placeholder="Secret Key / Password" />

    <div class="chat-header">

            <div>
                <div class="app-title">CYBER-CORE</div>
                <div style="font-size: 10px; color: var(--cyan-glow);" id="active-user-tag">NODE: SECURE</div>
            </div>

        <div class="header-actions">
            <button class="icon-btn" id="refresh-top-btn" title="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>
            <button class="icon-btn" id="menu-toggle-btn" title="Menu"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
        </div>
    </div>

    <!-- Messages Container -->

    <!-- Quick Emoji Bar -->

        <button class="emoji-btn" onclick="sendEmoji('⚡')">⚡</button>
        <button class="emoji-btn" onclick="sendEmoji('🚀')">🚀</button>
        <button class="emoji-btn" onclick="sendEmoji('🔒')">🔒</button>
        <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
        <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>

    <!-- Bottom Chat Input -->

<!-- Floating PWA Install Notification -->

<!-- Firebase & Core Chat Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD89l5DvOCYFIhjyRNVWq5upcbHqvh367U",
        authDomain: "massage-c0f44.firebaseapp.com",
        databaseURL: "https://massage-c0f44-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "massage-c0f44",
        storageBucket: "massage-c0f44.firebasestorage.app",
        messagingSenderId: "423050491790",
        appId: "1:423050491790:web:1b1549abbd3fa48450d6df"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    let audioCtx = null;
    let isSoundEnabled = true;

    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, type, duration) {
        if (!isSoundEnabled) return;
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    const soundEffects = {
        send: () => { playTone(600, 'sine', 0.1); setTimeout(() => playTone(880, 'sine', 0.15), 60); },
        receive: () => { playTone(450, 'triangle', 0.12); setTimeout(() => playTone(650, 'sine', 0.18), 80); },
        delete: () => { playTone(220, 'sawtooth', 0.12); }
    };

    const securityScreen = document.getElementById('security-screen');
    const secUsername = document.getElementById('sec-username');
    const secPassword = document.getElementById('sec-password');
    const secBtn = document.getElementById('sec-btn');
    const secTitle = document.getElementById('sec-title');
    const secDesc = document.getElementById('sec-desc');
    const activeUserTag = document.getElementById('active-user-tag');
    const messageInput = document.getElementById('message-input');
    
    let currentUser = "";

    function checkDeviceAuth() {
        const storedUser = localStorage.getItem("cyber_user");
        const storedPass = localStorage.getItem("cyber_pass");
        if (!storedPass) {
            secTitle.innerText = "INITIAL SETUP"; secDesc.innerText = "Set your Default Name and Security Key";
            secUsername.style.display = "block"; secBtn.innerText = "INITIALIZE DEVICE";
        } else {
            secTitle.innerText = "DEVICE LOCKED"; secDesc.innerText = `Welcome back, ${storedUser}. Enter Key:`;
            secUsername.style.display = "none"; secBtn.innerText = "UNLOCK CHANNEL";
        }
    }

    secBtn.addEventListener('click', () => {
        initAudio();
        const storedPass = localStorage.getItem("cyber_pass");
        const pass = secPassword.value.trim();

        if (!storedPass) {
            const user = secUsername.value.trim();
            if (!user || !pass) return alert("කරුණාකර නම සහ Password එක ඇතුලත් කරන්න!");
            localStorage.setItem("cyber_user", user); localStorage.setItem("cyber_pass", pass);
            currentUser = user; unlockUI();
        } else {
            if (pass === storedPass) { currentUser = localStorage.getItem("cyber_user"); unlockUI(); } 
            else { alert("Security Key වැරදියි! නැවත උත්සාහ කරන්න."); secPassword.value = ""; }
        }
    });

    function unlockUI() {
        securityScreen.style.display = "none";
        activeUserTag.innerText = `AGENT: ${currentUser.toUpperCase()}`;
        secPassword.value = ""; messageInput.focus();
    }

    document.getElementById('menu-toggle-btn').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('tech-menu').classList.toggle('show'); });
    document.addEventListener('click', () => document.getElementById('tech-menu').classList.remove('show'));
    document.getElementById('menu-refresh').addEventListener('click', () => location.reload());
    document.getElementById('refresh-top-btn').addEventListener('click', () => location.reload());
    document.getElementById('menu-sound').addEventListener('click', function() { isSoundEnabled = !isSoundEnabled; this.innerText = isSoundEnabled ? "🔊 Mute Sounds" : "🔇 Unmute Sounds"; });
    document.getElementById('menu-lock').addEventListener('click', () => { securityScreen.style.display = "flex"; checkDeviceAuth(); });
    document.getElementById('menu-reset').addEventListener('click', () => { if(confirm("ඔබගේ User Name සහ Password clear කිරීමට අවශ්‍යද?")) { localStorage.clear(); location.reload(); }});

    function sendMessage(customText = null) {
        const text = customText || messageInput.value.trim();
        if (!text || !currentUser) return;
        push(messagesRef, { sender: currentUser, text: text, timestamp: Date.now() })
        .then(() => soundEffects.send()).catch(err => alert("Transmission Error: " + err.message));
        if (!customText) messageInput.value = "";
    }

    document.getElementById('send-btn').addEventListener('click', () => sendMessage());
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    window.sendEmoji = function(emoji) { sendMessage(emoji); };

    onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        renderMessage(snapshot.key, data.sender, data.text, data.timestamp);
        if (data.sender !== currentUser) soundEffects.receive();
    });

    onChildRemoved(messagesRef, (snapshot) => {
        const row = document.getElementById(`msg-${snapshot.key}`);
        if (row) {
            row.style.transition = '0.3s'; row.style.opacity = '0'; row.style.transform = 'scale(0.8)';
            setTimeout(() => row.remove(), 300); soundEffects.delete();
        }
    });

    function renderMessage(id, sender, text, timestamp) {
        const isSelf = (sender === currentUser);
        const timeStr = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const row = document.createElement('div');
        row.id = `msg-${id}`; row.className = `message-row ${isSelf ? 'sent' : 'received'}`;
        row.innerHTML = `
            ${!isSelf ? `<div class="msg-sender">${sender}</div>` : ''}
            <div class="bubble">${escapeHTML(text)}</div>
            <div class="msg-meta"><span>${timeStr}</span><button class="delete-btn" onclick="window.deleteMsg('${id}')" title="Delete">✕</button></div>
        `;
        document.getElementById('messages-container').appendChild(row);
        document.getElementById('messages-container').scrollTo({ top: document.getElementById('messages-container').scrollHeight, behavior: 'smooth' });
    }

    window.deleteMsg = function(msgId) { if (confirm("මෙම Message එක සදහටම Delete කරන්නද?")) remove(ref(db, `messages/${msgId}`)); };
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

    checkDeviceAuth();
</script>

<!-- Dynamic PWA Creation & Floating Banner Script -->
<script>
    // 1. Create Manifest and Service Worker Dynamically in JS (No extra files needed)
    (function initDynamicPWA() {
        const manifestObj = { 
            "name": "CYBER-CORE Secure Chat", "short_name": "CYBER-CORE", 
            "start_url": window.location.href.split('?')[0], 
            "display": "standalone", "background_color": "#060913", "theme_color": "#00f2fe", 
            "icons": [ 
                { "src": "https://cdn-icons-png.flaticon.com/512/3256/3256783.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" } 
            ] 
        };
        const encodedManifest = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
        let manifestLink = document.createElement('link'); 
        manifestLink.rel = 'manifest'; manifestLink.href = encodedManifest; 
        document.head.appendChild(manifestLink);
        
        if ('serviceWorker' in navigator) { 
            // Dummy service worker to pass PWA criteria
            const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => {});`; 
            const blob = new Blob([swCode], { type: 'application/javascript' }); 
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW Reg Failed:', err)); 
        }
    })();

    // 2. Install Prompt & UI Banner Logic
    let deferredPrompt = null;
    const pwaNotification = document.getElementById('pwaNotification');
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');
    const pwaCloseBtn = document.getElementById('pwaCloseBtn');
    const menuInstallBtn = document.getElementById('menu-install');
    
    // Check if dismissed previously
    const isPwaDismissed = sessionStorage.getItem('cyber-pwa-dismissed');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // Always show install option in dropdown menu
        menuInstallBtn.style.display = 'flex';

        // Show floating banner after a short delay if not dismissed
        if (!isPwaDismissed) {
            setTimeout(() => {
                pwaNotification.classList.add('show');
            }, 2500);
        }
    });

    async function triggerInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                console.log('App Installed Successfully');
            }
            deferredPrompt = null;
            pwaNotification.classList.remove('show');
            menuInstallBtn.style.display = 'none';
        } else {
            alert("To Install App:\n\n1. Tap the Browser Menu ( ⋮ or ⇪ )\n2. Select 'Add to Home screen' or 'Install App'");
            pwaNotification.classList.remove('show');
        }
    }

    // Attach install trigger to both buttons
    pwaInstallBtn.addEventListener('click', triggerInstall);
    menuInstallBtn.addEventListener('click', triggerInstall);

    // Close Banner Logic
    pwaCloseBtn.addEventListener('click', () => {
        pwaNotification.classList.remove('show');
        sessionStorage.setItem('cyber-pwa-dismissed', 'true'); // Prevents annoying user in same session
    });

    // Hide UI when app is installed
    window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        pwaNotification.classList.remove('show');
        menuInstallBtn.style.display = 'none';
    });
</script>

</body>
</html>
